name: Residential proxy test

# A metered answer to "does a residential proxy get the collector served?"
# Run by hand only. Touches no database and writes nothing; the pages that came
# back are kept as an artifact so a refusal can be read, not just counted.
# What it tests and why, including why SMC and Superimmo are diagnostic only:
# the note at the top of scripts/proxy-test.mjs.
#
# Needs the repository secret PMA_RESIDENTIAL_PROXY (http://user:pass@host:port).
# Only the portals' own HTML documents go through it; installing Node packages
# and Chromium below goes out direct and costs the proxy nothing.

on:
  workflow_dispatch:
    inputs:
      portals:
        description: "Comma-separated, run in this order."
        required: false
        default: "figaro,jamesedition,smc,superimmo"
      listings:
        description: "Listing pages per portal after its index."
        required: false
        default: "3"
      budget_mb:
        description: "Hard cap on proxy traffic for the run, overhead margin included."
        required: false
        default: "30"

jobs:
  proxy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test through the proxy
        run: >
          node scripts/proxy-test.mjs
          --portals=${{ inputs.portals }}
          --listings=${{ inputs.listings }}
          --budget-mb=${{ inputs.budget_mb }}
          --out=proxy-test-pages
        env:
          PMA_RESIDENTIAL_PROXY: ${{ secrets.PMA_RESIDENTIAL_PROXY }}
          CRAWLER_USER_AGENT: ${{ secrets.CRAWLER_USER_AGENT }}

      - name: Keep the pages that came back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-test-${{ github.run_id }}
          path: proxy-test-pages
          retention-days: 7
          if-no-files-found: warn
