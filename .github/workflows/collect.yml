name: Nightly collection

# WHY HERE AND NOT ON THE APP PLATFORM
#
# A pass runs for hours at one request per second, needs a real Chromium for
# five of the six sources, and writes pages that have to outlive the run. A
# serverless function has none of those: it is capped in seconds, cannot carry a
# browser inside its bundle, and has no disk. This is a script on a timer, and
# it belongs somewhere that can be one.
#
# ⚠ IP ADDRESSES. GitHub's runners come from large shared datacentre ranges, and
# a different one every night. Blocks and rate limits are applied per address,
# so our ability to collect rides on the reputation of a pool we share with
# everyone else using Actions — Superimmo already answers 429 generously.
#
# The honest identification still holds: CRAWLER_USER_AGENT names us on every
# request, and LuxuryEstate's X-Collector header is sent whatever the address.
# But the moment a portal offers to allowlist us, this has to move to a host
# with a fixed address. `npm run nightly` takes no position on where it runs, so
# that move is this file and nothing else.

on:
  schedule:
    # 21:00 UTC — 23:00 in Paris in summer, 22:00 in winter.
    #
    # THE DEADLINE THIS SERVES IS NOT OURS. Med-Estates run their own CRM sync
    # and matching from 03:00 Paris, so everything here has to be finished
    # before then or their job spends two hours reading yesterday's market.
    #
    # The time is that deadline minus the two things between us and it:
    #
    #   03:00 Paris  deadline
    #  -00:45        the collecting itself, measured 43-57 min
    #  -02:30        GitHub's observed lateness starting a scheduled run
    #   ------
    #   23:45 Paris  the latest a start can be booked
    #
    # 23:00 rather than 23:45, because that lateness is a measurement and not a
    # promise: 5-9 September it was four and three quarter hours.
    #
    # ⚠ WINTER. Cron has no daylight saving, so in CET this line is 00:00 local
    # — an hour before the 01:00–05:00 window LuxuryEstate asked us to keep. In
    # practice GitHub has been starting these runs 2.5 to 5 hours late (measured
    # 5-9 September), which lands them inside the window anyway, but that is
    # luck and not a plan. When the clocks change, either move this to 00:00 UTC
    # or give LuxuryEstate a workflow of its own inside its hours, the way
    # Superimmo already has one.
    #
    # The schedule is what actually keeps that promise. run.ts WARNS when a
    # pass falls outside the window and collects anyway — deliberately, so an
    # operator can override it — which this comment used to claim was a refusal.
    # It is not. On 2026-09-03 a manual `--source=luxuryestate` ran at 21:00
    # Paris and the only thing that happened was a line in the log.
    #
    # So: this cron line, and nothing else, is why the nightly pass lands inside
    # the hours they asked for.
    # Monday to Saturday.
    - cron: "0 21 * * 1-6"

    # Sunday, same hour: THE FULL SWEEP.
    #
    # A source with a delta stop reads the top of the list and stops once the
    # portal is only showing it listings it already holds. That finds
    # everything NEW — new listings appear at the top — and can never notice
    # anything GONE, because a sold listing disappears from the middle of a
    # list we no longer read to the end. Superimmo said so itself on
    # 2026-09-04: "discovery incomplete — 2831 listings left active rather
    # than delisted".
    #
    # Left alone that is not an optimisation but a slow corruption: sold
    # properties stay `active` for ever and reach the client as available.
    # Once a week the whole list gets walked and the delistings get written.
    #
    # Two crons at the same hour rather than one plus an offset: they are
    # mutually exclusive by day, so they can never queue behind each other.
    # `--full` does nothing on a source without a delta stop, so this stays
    # correct as more of them get one.
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys. Blank means every enabled one."
        required: false
      parallel:
        description: "How many sources at once. 1 is safest; 2 halves the night."
        required: false
        default: "1"
      communes:
        description: "Comma-separated INSEE codes. Blank means every subscribed one. Use for a probe, not a night."
        required: false
      full:
        description: "Walk every list to the end, ignoring delta stops. This is what writes delistings."
        required: false
        type: boolean
        default: false

concurrency:
  # Never two nights at once. Neither would corrupt anything — the diff and the
  # unique index both hold — but together they double our request rate at sites
  # that allowed us in on the understanding we would be reasonable.
  group: nightly-collection
  cancel-in-progress: false

# Read the repository, nothing more. The collecting job runs `npm ci` and
# parses other people's pages; it has no business holding a token that can
# write anywhere. The one job that writes (an issue, below) asks for that alone.
permissions:
  contents: read

jobs:
  collect:
    # `PMA_RUNNER` (repo variable) = `self-hosted` moves the pass to our EU box
    # — see scripts/aws/README.md. Unset, it runs on GitHub's runners as before.
    runs-on: ${{ vars.PMA_RUNNER || 'ubuntu-latest' }}
    # Below GitHub's own 6-hour ceiling on purpose. Being killed by the platform
    # leaves a `running` row in portal_runs and no summary; being killed by this
    # leaves the same, but at a time we chose and can reason about.
    timeout-minutes: 330
    outputs:
      # The night's summary.txt, so the failure report below can quote it.
      # Empty when the run died before writing one.
      summary: ${{ steps.summary.outputs.text }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NOT OPTIONAL, and not covered by `npm ci`.
      #
      # The `playwright` package has no install script — `hasInstallScript` is
      # false in the lock file — so npm installs the library and no browser.
      # Five of the six sources need a real one, and without this each of them
      # walks its entire discovery phase and then fails on its first listing.
      - name: Install Chromium
        # `--with-deps` needs root: fine on GitHub's image, not on our own box,
        # where the bootstrap installed the libraries once and the runner user
        # has no sudo. Same browser build either way.
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Seconds, no portal touched. It catches a wrong connection string, a
      # missing browser, a source with no subscriber and an empty enabled list —
      # each of which would otherwise be discovered an hour into the run, one
      # source at a time, in a log read the next morning.
      - name: Preflight
        run: npm run nightly -- --check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECTOR_USER_AGENT: ${{ secrets.CRAWLER_USER_AGENT }}

      - name: Collect
        # The inputs arrive through `env:` and are read as "$VARIABLES", never
        # written into this script as `${{ inputs.* }}`. Interpolated, a value is
        # pasted into the shell source before bash reads it: a `$(…)` typed into
        # the `communes` box would run, in a step that holds every secret below.
        run: |
          ARGS="--parallel=$IN_PARALLEL"
          if [ -n "$IN_SOURCES" ]; then ARGS="$ARGS --sources=$IN_SOURCES"; fi
          if [ -n "$IN_COMMUNES" ]; then ARGS="$ARGS --communes=$IN_COMMUNES"; fi
          # Sunday's schedule, or a hand-triggered run that asked for it.
          if [ "$SCHEDULE" = "0 21 * * 0" ] || [ "$IN_FULL" = "true" ]; then
            ARGS="$ARGS --full"
            echo "FULL SWEEP — every list walked to the end, so delistings get written."
          fi
          # Superimmo is deliberately not part of this night — see superimmo.yml.
          #
          # It is throttled to roughly four requests a quarter of an hour, which
          # is not slowness but a refusal expressed as delay. On 2026-09-06 it
          # spent three hours discovering 1100 of its ~2800 listings, was killed
          # by the 180-minute watchdog, and returned nothing — while the other
          # five sources finished in twenty minutes between them and then waited.
          #
          # A subtraction rather than a hand-written list of the other five, so
          # that a seventh portal is included by default rather than forgotten.
          ARGS="$ARGS --exclude=superimmo"
          # Unquoted on purpose: ARGS is several flags and has to split into
          # them, exactly as it did when the inputs were pasted in.
          npm run nightly -- $ARGS
        env:
          # Blank on a scheduled night, which is what the defaults are for.
          IN_PARALLEL: ${{ inputs.parallel || '1' }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_COMMUNES: ${{ inputs.communes }}
          IN_FULL: ${{ inputs.full }}
          SCHEDULE: ${{ github.event.schedule }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          COLLECTOR_USER_AGENT: ${{ secrets.CRAWLER_USER_AGENT }}
          COLLECTOR_HEADER: ${{ secrets.COLLECTOR_HEADER }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          # Residential egress for the sources whose config names it (Figaro,
          # JamesEdition). Empty until the secret exists; a source configured
          # for it then refuses to run rather than going out direct.
          PMA_RESIDENTIAL_PROXY: ${{ secrets.PMA_RESIDENTIAL_PROXY }}
          # Stream.Estate's API key (V2 beta). Read by the adapter from the environment only.
          STREAM_ESTATE_V2_API_KEY: ${{ secrets.STREAM_ESTATE_V2_API_KEY }}
          # The client's V1 key: billed per item, 15 000 a month. Every request goes
          # through the meter in src/lib/portals/streamV1.ts, which keeps its count in
          # the database and refuses a page that would pass the cap.
          STREAM_ESTATE_API_KEY: ${{ secrets.STREAM_ESTATE_API_KEY }}

      # `always()`, because the summary matters most on the night that failed.
      - name: Publish the summary
        id: summary
        if: always()
        run: |
          if [ -f logs/latest/summary.txt ]; then
            {
              echo '```'
              cat logs/latest/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also as the job's output, for the issue a failed night opens.
            # printf, so the last line ends in a newline whatever the file
            # does: a delimiter glued to it is not found, and the step fails.
            {
              echo "text<<PMA_SUMMARY_$GITHUB_RUN_ID"
              printf '%s\n' "$(cat logs/latest/summary.txt)"
              echo "PMA_SUMMARY_$GITHUB_RUN_ID"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No summary was written — the run died before it got that far." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn

      # Only when S3 is not configured. Without it the collector writes pages to
      # .pages/ on the runner, which is destroyed with the job — so the run
      # would leave nothing to re-parse against, and `npm run reparse` would
      # have nothing to work on. This is a stopgap that shouts, not a solution.
      #
      # The test is in the script, not in `if:`. A step's own `env:` is not
      # yet set when its `if:` is evaluated, so `env.S3_BUCKET == ''` read an
      # empty value on every night and the warning printed whether S3 was
      # configured or not. And the message is in single quotes: in double
      # quotes the backticks around the command ran `npm run reparse`.
      - name: Warn if pages have nowhere to go
        if: always()
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo '::warning::S3_BUCKET is not set. Fetched pages were written to the runner and are now gone. `npm run reparse` cannot be used against this collection.'
          fi
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

  # ── A red night has to reach a person ─────────────────────────────────────
  #
  # JamesEdition kept this workflow red for four weeks — refused with 403 from
  # 16 September, switched off on 14 October — and nobody was told. A red cross
  # on the Actions tab is a signal only to someone who opens the Actions tab,
  # and nobody does that to check on a job that is supposed to just work.
  #
  # So a failed night opens an issue labelled `nightly-failure`, mentioning
  # the repository's owner, and GitHub sends that as an email. While it stays
  # open, every further red night is a comment on it rather than a new issue:
  # one thread per outage, not one per night. Close it when the night is green
  # again; the next failure opens a fresh one.
  #
  # A JOB OF ITS OWN, not a last step of `collect`, for two reasons:
  #   - It has to run when `collect` could not finish: killed at 330 minutes,
  #     or the self-hosted box gone mid-run, where a last step of that job may
  #     never get to run. This one runs on GitHub's runner whatever happened
  #     to the other.
  #   - It is the only thing here that writes to the repository. Kept apart,
  #     the job that runs `npm ci` and parses portal pages never holds that
  #     token.
  #
  # What counts as red: anything but success, except a run cancelled by hand
  # (whoever cancelled it already knows). That includes a night where any
  # source is graded FAIL: nightly.ts exits 1 for those, and that is what
  # turns the Collect step red. A `warn` night exits 0 and stays quiet.
  report-failure:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open an issue, or add to the one already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.collect.result }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTOR: ${{ github.triggering_actor }}
          SUMMARY: ${{ needs.collect.outputs.summary }}
        run: |
          LABEL=nightly-failure
          if [ "$EVENT" = "schedule" ]; then
            TRIGGER="the schedule ($SCHEDULE)"
          else
            TRIGGER="$EVENT, started by $ACTOR"
          fi

          BODY="$RUNNER_TEMP/body.md"
          {
            echo "The nightly collection ended with result **$RESULT** (reported $(date -u '+%Y-%m-%d %H:%M') UTC)."
            echo
            echo "- Run: $RUN_URL"
            echo "- Trigger: $TRIGGER"
            echo
            if [ -n "$SUMMARY" ]; then
              echo '```'
              printf '%s\n' "$SUMMARY"
              echo '```'
            else
              echo "No summary reached this report. Either the run stopped before the collector"
              echo "finished (install, migrations, preflight, the 330-minute limit, the runner"
              echo "itself), or GitHub withheld it for containing a secret's value."
              echo "The run's log says which."
            fi
          } > "$BODY"

          # The label has to exist before an issue can carry it. --force makes
          # this a no-op on every night after the first.
          gh label create "$LABEL" --force --color B60205 \
            --description "Opened by collect.yml when a night fails" > /dev/null

          OPEN="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file "$BODY"
            echo "Added to issue #$OPEN."
          else
            {
              echo "@$OWNER — a night of collection failed."
              echo "Later failures are added here as comments while this issue is open."
              echo "Close it once the night is green again; the next failure opens a new one."
              echo
              cat "$BODY"
            } > "$BODY.new"
            gh issue create --title "Nightly collection is failing" --label "$LABEL" --body-file "$BODY.new"
          fi
