3cspan\u003e\u003cb\u003eCommonhold\u003c/b\u003e is a type of freehold ownership for a property that's within a development. A commonhold or residents’ association owns andmanages the common parts of the property (like stairs and hallways). You'll need to join the commonhold association and contribute towards maintaining the development. It is good practice to check additional costs that will apply to the property and factor this into your budget considerations.\u003c/span\u003e\u003cspan\u003e\u003cb\u003eNon-traditional\u003c/b\u003e\u003cbr/\u003eWhen you buy a park home, you own the building itself, but not the land it sits on. Instead, you'll rent the pitch from the site owner. There will be annual fees to pay to the site owner and it is important to know how often these charges are reviewed.\u003c/span\u003e\u003cspan\u003eWhen you buy a houseboat, you own the boat itself, but there will also be boat licenses and mooring fees to pay. It is important to know how often these charges are reviewed. \u003c/span\u003e"},{"title":"Council tax band","value":"Not available","key":"council_tax_band","description":"\u003cspan\u003eCouncil tax is payable on all domestic properties. The amount you pay depends on the tax band. You can check the charges for each tax band online via the following websites:\u003c/span\u003e\u003cspan\u003eEngland and Wales - \u003ca href='https://www.gov.uk/council-tax-bands' target='_blank'\u003ehttps://www.gov.uk/council-tax-bands\u003c/a\u003e\u003c/span\u003e\u003cspan\u003eScotland - \u003ca href='https://www.saa.gov.uk/' target='_blank'\u003ehttps://www.saa.gov.uk\u003c/a\u003e\u003c/span\u003e\u003cspan\u003eYou may have personal circumstances which mean that you pay a reduced rate. You can get more information from the local council.\u003c/span\u003e"}],"derivedEPC":null,"smartTags":["attributes.garden","style.modern"],"analyticsEcommerce":{"__typename":"ListingAnalyticsEcommerce","brand":"Properstar","category":"overseas/resi/agent/p
