rel préservé, entouré de vignobles, planté d'essences méditerranéennes. Tout ici respire l'espace et la lumière. On est sur la presqu'île de Saint-Tropez, et pourtant on se croirait au coeur d'une campagne intacte, loin de tout. C'est exactement cette dualité qui rend cette adresse si rare.\n La bastide principale développe environ 330 m2 sur deux niveaux. Au rez-de-chaussée, les espaces de réception se déploient avec générosité : un salon, une salle à manger, une cuisine indépendante, et surtout une large terrasse couverte fermée qui prolonge la maison vers le panorama -- un espace où l'on vit aussi bien en plein été qu'aux premières fraîcheurs d'automne. Quatre chambres avec salles de douche complètent ce niveau, chacune baignée de cette lumière qui traverse la maison du matin au soir.\n À l'étage, la suite parentale est un monde à part. Salle de bains complète, dressing, bureau -- et cette vue dominante qui vous accompagne dès le réveil. C'est un espace pensé pour le confort et le calme, avec une hauteur de perspective qu'on ne rencontre que dans les positions en promontoire.\n Mais ce qui distingue vraiment cette propriété, c'est son organisation. Trois pavillons indépendants, chacun avec sa propre suite et salle de douche, permettent d'accueillir famille et invités sans que personne ne se marche dessus. Neuf suites au total. Le domaine fonctionne comme un petit hôtel de charme privé -- avec l'intimité en plus. Une annexe avec salon et buanderie complète l'ensemble avec discrétion.\n Dehors, le parc paysager méditerranéen entoure la propriété d'un écrin de verdure préservée. La piscine, en position dominante, offre un point de vue spectaculaire sur les collines et le Golfe. Un court de tennis et de vastes espaces extérieurs renforcent le caractère de ce lieu conçu pour vivre au grand air.\n Et la localisation joue sur les deux tableaux. Les plages de Gigaro sont à quelques minutes. Le village de Saint-Tropez et Pampelonne sont à portée de main. L'aéroport privé  au calme et à la détente.\n\n Intégrée harmonieusement dans le bâti tout en conservant une totale autonomie, la dépendance dispose de son propre séjour avec coin cuisine, d'une chambre et d'une salle de douche -- offrant une intimité parfaite pour recevoir famille ou amis dans les meilleures conditions.\n\n Terrain de pétanque, grand parking et vastes espaces extérieurs parachèvent cette propriété pensée pour profiter pleinement du cadre exceptionnel de Saint-Tropez, en toute quiétude.\n\n Honoraires d'agence à la charge du vendeur.\nLa présentation d'une pièce d'identité en cours de validité sera demandée à la visite, conformément à l'article L. 561-5 du Code monétaire et financier. Les informations sur les risques auxquels ce bien est exposé, y compris l'obligation légale de débroussaillement, sont disponibles sur le site Géorisques : http://www.georisques.gouv.fr.\nLa présente annonce immobilière a été rédigée sous la responsabilité éditoriale de M Olivier Combeau mandataire indépendant en immobilier (sans détention de fonds), agent commercial de la SAS I@D France immatriculé au RSAC de CANNES sous le numéro 838059533, titulaire de la carte de démarchage immobilier pour le compte de la société I@D France SAS.Informations LOI ALUR :  Honoraires charge vendeur. (gedeon_6727_33215153)",{"energy":1490,"ges":50,"energyCategory":198,"gesCategory":198,"gesStatus":199,"energyConsumptionStatus":199,"cityAverage":40},55,{"photos":1492,"photosCount":1578},[1493,1497,1501,1505,1508,1511,1514,1517,1520,1523,1526,1529,1532,1535,1538,1541,1544,1547,1550,1553,1556,1559,1562,1565,1569,1573,1577],{"order":35,"url":1494,"aiAlt":1496},{"medium":1495},"https://lh3.googleusercontent.com/JQXpGhgBNX87bzuxIyNjA1a3WoEvm6SxcWRvjphuUfhKsEjWV2K9jlXNgbDNGBB0DEaDjLCzU4_1nc0sP4lKBvw7saoZy51fE7Zqcgs=rw-w700-h660-l80","Maison à vendre à Saint-Tropez (83) - Maison avec piscine, jardin verdoyant",{"order":50,"url":1498,"aiAlt":1500},{"medium":1499},"https://lh3.googleusercontent.com/HE8kyelrAU_zYJ  unité avec les maisons voisines aux teintes de terre cuite corail et blanc cassé. Construite en 1979 et orientée est-ouest, elle développe une surface de près de 90 m² et compte une pièce de séjour, une cuisine, quatre chambres, deux salles de bain et une de douche ainsi que deux balcons et une terrasse aménagée en petit jardin.\nSur fond de ciel bleu azur, l'ambiance qui environne l'habitation entretient parfaitement l'enchantement d'un vieux village provençal.","Découvrez cette maison à vendre à Saint-Tropez, située au cœur de Port Grimaud dans le département du Var, en Provence-Alpes-Côte d'Azur. Imaginez vivre dans un cadre unique où les rues laissent place à des canaux, et où les voitures sont remplacées par des bateaux. Ce bien immobilier idéalement situé au bord du golfe de Saint-Tropez est parfait pour les passionnés de nautisme à la recherche d'une maison à acheter à Saint-Tropez, avec son propre ponton pour amarrer votre bateau de plaisance. L'accès à la maison se fait par une rue sécurisée qui offre un cadre tranquille, avec un emplacement de parking à proximité pour faciliter votre quotidien. Cette maison fait partie d'un ensemble de logements mitoyens, caractérisés par l'architecture du célèbre architecte François Spoerry qui a imaginé un village pour les amoureux de la mer. Datant de 1979, cette maison orientée est-ouest offre environ 90 m² de surface habitable, incluant un spacieux séjour, une cuisine, quatre chambres, deux salles de bain, une douche, ainsi que deux balcons et une terrasse joliment aménagée en petit jardin. Avec sa toiture en tuiles canal et ses façades aux teintes crème mêlées à des touches de couleur terre cuite, la maison présente un charme typiquement provençal, renforcé par l'atmosphère envoûtante du ciel bleu azur qui l'entoure.",{"energy":2118,"ges":2119,"energyCategory":2120,"gesCategory":2120,"gesStatus":199,"energyConsumptionStatus":199,"cityAverage":40},207,54,"E",{"photos":2122,"photosCount":242},[2123,2127,2131,2135,2138
